    <style>
        :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); --header-bg: #f1f5f9; }
        html, body { margin:0;padding:0; background: var(--header-bg); color:#1e293b; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif; height:100%;width:100%; overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased; }
        #app { width:100%; height:100dvh; max-width:450px; margin:0 auto; display:flex; flex-direction:column; position:relative; background:#f1f5f9; box-shadow:0 0 50px rgba(0,0,0,.08); }
        .font-num { font-family: 'Inter', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
        .bank-card { flex:0 0 88%; scroll-snap-align:center; margin-right:12px; border-radius:24px; color:white; position:relative; overflow:hidden; padding:24px; min-height:190px; display:flex; flex-direction:column; justify-content:space-between; box-shadow: 0 8px 24px -8px rgba(0,0,0,0.35); z-index: 1; }
        .bank-card::after { content: ''; position: absolute; top: 0; left: -50%; width: 200%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.06), transparent); transform: rotate(30deg); pointer-events: none; }
        .bg-card-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%) !important; }
        .bg-card-emerald { background: linear-gradient(135deg, #065f46 0%, #10b981 100%) !important; }
        .bg-card-reminder { background: linear-gradient(135deg, #312e81 0%, #4338ca 100%) !important; }
        .medal-gradient { background: linear-gradient(to right, #f59e0b, #ea580c) !important; color: white !important; }
        .history-gradient { background: linear-gradient(to bottom right, #6366f1, #9333ea) !important; color: white !important; }
        .fund-gradient { background: linear-gradient(to bottom right, #334155, #0f172a) !important; color: white !important; }
        .bg-personal-blue { background-color: #2563eb !important; color: white !important; border-color: #1d4ed8 !important; }
        .siren-bar { height:6px;width:100%;display:flex;position:absolute;top:0;left:0;z-index:20; }
        @keyframes siren-breath-red { 0%,100%{background:#ef4444;opacity:.3}50%{background:#f00;opacity:1;box-shadow:0 0 15px rgba(239,68,68,.5)} }
        @keyframes siren-breath-blue { 0%,100%{background:#3b82f6;opacity:1;box-shadow:0 0 15px rgba(59,130,246,.5)}50%{background:#2563eb;opacity:.3} }
        .siren-red { flex:1;animation:siren-breath-red 2.5s ease-in-out infinite;border-top-left-radius:32px; }
        .siren-blue { flex:1;animation:siren-breath-blue 2.5s ease-in-out infinite;border-top-right-radius:32px; }
        .login-card { background:#fff;border:1px solid rgba(226,232,240,.5);box-shadow:0 25px 50px -12px rgba(15,23,42,.15);position:relative;overflow:hidden; }
        .med-input { background:#f8fafc!important;border:1px solid #cbd5e1!important;outline:none;border-radius:16px;font-size:15px;font-weight:600; }
        .med-btn { background:linear-gradient(180deg,#3b82f6 0%,#2563eb 100%);color:white;border-radius:16px;font-weight:800;border:1px solid #1d4ed8; }
        .horizontal-scroll { display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none; }
        .horizontal-scroll::-webkit-scrollbar { display:none; }
        .list-card { background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 4px 6px -1px rgba(0,0,0,.02);overflow:hidden; }
        .fade-in { animation:fadeIn .4s cubic-bezier(.16,1,.3,1); }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }
        .dashboard-wrapper { flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0; }
        .cards-section { flex-shrink:0; overflow:hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1), opacity .35s ease, padding .35s ease; will-change: max-height, opacity; }
        .cards-section.expanded { max-height:260px; opacity:1; padding:12px 0 8px; }
        .cards-section.collapsed { max-height:0; opacity:0; padding:0; pointer-events:none; }
        .tabs-section { flex-shrink:0; background:#f1f5f9; z-index:30; border-bottom: 1px solid #e2e8f0; }
        .slides-section { flex:1;overflow:hidden;min-height:0; }
        .content-slider { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; width:100%; height:100%; }
        .content-slider::-webkit-scrollbar { display:none; }
        .slide-page { flex:0 0 100%; width:100%; scroll-snap-align:start; padding:0 20px 100px 20px; box-sizing:border-box; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        .slide-page::-webkit-scrollbar { display:none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e2e8f0; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .calendar-day-header { background: #f8fafc; padding: 8px 0; text-align: center; font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; }
        .calendar-cell { background: #fff; min-height: 70px; padding: 4px; position: relative; transition: background 0.2s; }
        .calendar-cell.other-month { background: #f1f5f9; color: #cbd5e1; }
        .calendar-cell.today .day-num { background: #2563eb; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        .day-num { font-size: 11px; font-weight: 800; font-family: 'Inter'; margin-bottom: 2px; }
        .bottom-sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .bottom-sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top-left-radius: 32px; border-top-right-radius: 32px; z-index: 101; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-width: 450px; margin: 0 auto; padding: 24px; padding-bottom: calc(24px + var(--safe-bottom)); }
        .bottom-sheet.active { transform: translateY(0); }
        .hour-btn { height: 50px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-family: 'Inter'; font-weight: 800; color: #64748b; transition: all 0.2s; }
        .hour-btn.selected { background: #2563eb !important; color: white !important; border-color: #1d4ed8 !important; transform: scale(0.95); }
        .tabs-scroll-container { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 4px 20px 8px 20px; gap: 12px; }
        .tab-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 4px 0; min-width: 0; }
        .type-tag { font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .tag-meeting { background: #f3e8ff; color: #7e22ce; }
        .tag-travel { background: #ecfdf5; color: #047857; }
        .tag-dinner { background: #fff7ed; color: #c2410c; }
        .tag-official { background: #fff1f2; color: #e11d48; }
        .expired-task { opacity: 0.6; filter: grayscale(0.5); }
        .task-card-header { border-bottom: 1px dashed #e2e8f0; }
        .task-card-date-box { background: #f8fafc; border-radius: 14px; padding: 10px 0; min-width: 72px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .bottom-sheet { max-height: 94dvh !important; display: flex; flex-direction: column; padding-left: 20px !important; padding-right: 20px !important; padding-top: 16px !important; }
        .modal-scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 150px; }
        .med-input { font-size: 16px !important; padding: 12px 16px !important; appearance: none; -webkit-appearance: none; }

        .admin-panel-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .admin-stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        .admin-stat-box { background: #f8fafc; border-radius: 16px; padding: 14px 12px; border: 1px solid #e2e8f0; }
        .admin-stat-label { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; margin-bottom: 4px; }
        .admin-stat-value { font-size: 26px; font-weight: 800; font-family: 'Inter'; letter-spacing: -0.03em; }
        .push-indicator { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 20px; }
        .push-ok   { background: #f0fdf4; color: #15803d; }
        .push-fail { background: #fff1f2; color: #be123c; }
        .push-none { background: #f1f5f9; color: #94a3b8; }
        .push-nosub{ background: #fefce8; color: #a16207; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
        .dot-green  { background: #22c55e; box-shadow: 0 0 0 2px #dcfce7; }
        .dot-red    { background: #ef4444; box-shadow: 0 0 0 2px #fee2e2; }
        .dot-amber  { background: #f59e0b; box-shadow: 0 0 0 2px #fef3c7; }
        .admin-member-row { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid #f1f5f9; gap: 10px; transition: background 0.15s; }
        .admin-member-row:last-child { border-bottom: none; }
        .admin-member-row:active { background: #f8fafc; }
        .admin-avatar { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; }
        .admin-filter-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 12px; }
        .admin-filter-tabs::-webkit-scrollbar { display: none; }
        .admin-filter-btn { flex: 0 0 auto; font-size: 10px; font-weight: 900; padding: 6px 14px; border-radius: 20px; border: 1px solid #e2e8f0; background: #fff; color: #64748b; transition: all 0.2s; }
        .admin-filter-btn.active { background: #1e293b; color: #fff; border-color: #1e293b; }
        .activity-chip { font-size: 9px; font-weight: 900; padding: 2px 7px; border-radius: 6px; display: inline-block; margin-right: 3px; }
        .chip-shift   { background: #eff6ff; color: #1d4ed8; }
        .chip-duty    { background: #fff1f2; color: #be123c; }
        .chip-meeting { background: #faf5ff; color: #7e22ce; }
        .admin-edit-field { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; min-width: 0; overflow: hidden; }
        .admin-edit-label { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; margin-bottom: 6px; display: block; }
      .admin-edit-input { width: 100%; max-width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 8px; font-size: 14px; font-weight: 700; color: #1e293b; outline: none; font-family: 'Inter', sans-serif; box-sizing: border-box; appearance: none; -webkit-appearance: none; min-width: 0; }
        .admin-edit-select { width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; color: #1e293b; outline: none; font-family: 'Inter', sans-serif; appearance: none; -webkit-appearance: none; min-width: 0; }
        .admin-edit-section-title { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; padding: 4px 0 8px 2px; border-bottom: 1px solid #f1f5f9; margin-bottom: 10px; }

        /* 紅色防呆錯誤提示輸入框樣式 */
        .input-error { border-color: #fca5a5 !important; background-color: #fef2f2 !important; color: #e11d48 !important; }
        .input-error::placeholder { color: #fca5a5 !important; }
        /* 案件與全隊紀錄搜尋篩選樣式 */
        .search-filter-box { background: #fff; border-radius: 20px; padding: 12px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
        .filter-select { background: #f1f5f9; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 800; border: none; outline: none; color: #475569; appearance: none; -webkit-appearance: none; }
        .case-card-sky { background: #f0f9ff !important; border: 1px solid #7dd3fc !important; }
/* ===== 最新消息視窗動畫 ===== */
.fade-scale-enter-active, .fade-scale-leave-active { 
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
}
.fade-scale-enter-from, .fade-scale-leave-to { 
    opacity: 0; 
    transform: scale(0.95) translateY(10px); 
}

    </style>
</head>
<body>
<div id="app">

   <!-- 登入頁 -->
    <div v-if="currPage === 'login'" class="flex-1 flex flex-col justify-center p-6 fade-in relative" :style="{ paddingTop: 'var(--safe-top)' }">
        <div class="login-card rounded-[32px] w-full mx-auto max-w-[360px]">
            <div class="siren-bar"><div class="siren-red"></div><div class="siren-blue"></div></div>
            <div class="p-10 pt-16 pb-12">
                <div class="login-title-box border-l-4 border-blue-500 pl-4 mb-10">
                    <h1 class="text-3xl font-black tracking-tight text-slate-800">HAISHAN EMS</h1>
                    <p class="text-[10px] text-blue-600 font-black tracking-[0.1em] uppercase mt-1">VOLUNTEER AI PLATFORM</p>
                    <p class="text-[15px] text-slate-500 font-bold mt-1 tracking-wider">海山救護義消智慧平台</p>
                </div>

                <!-- 狀態 1：檢查登入狀態中 (自動秒登入) -->
                <div v-if="authLoading" class="text-center py-8">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                    <p class="text-sm font-black text-slate-500">系統身分驗證中...</p>
                </div>

                <!-- 狀態 2：尚未 Google 登入 -->
                <div v-else-if="!googleUser" class="space-y-5 text-center">
                    <p class="text-xs font-bold text-slate-400 mb-6">請先使用 Google 帳號進行快速登入</p>
                    <button @click="loginWithGoogle" class="w-full py-4 rounded-2xl bg-white border border-slate-200 text-slate-700 font-black text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center gap-3">
                        <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google">
                        使用 Google 帳號登入
                    </button>
                </div>

                <!-- 狀態 3：已 Google 登入，但尚未綁定身分 (第一次使用) -->
                <div v-else class="space-y-5 text-left">
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 text-center">
                        <p class="text-[10px] font-black text-blue-500 uppercase">已連接 Google 帳號</p>
                        <p class="text-xs font-bold text-slate-700 mt-1">{{ googleUser.email }}</p>
                    </div>

                    <!-- 還有尚未綁定的人員時顯示 -->
                    <template v-if="sortedLoginMembers.length > 0">
                        <p class="text-xs font-black text-rose-500 mb-2"><i class="fa-solid fa-circle-exclamation mr-1"></i>首次使用請綁定您的隊員身分</p>

                        <div class="relative flex items-center">
                            <i class="fa-solid fa-user-doctor absolute left-4 text-slate-400 z-20"></i>
                            <select v-model="loginForm.name" class="med-input w-full p-4 appearance-none text-slate-700 bg-white relative z-10" style="padding-left: 3.5rem !important;">
                                <option value="" disabled>請選擇救護人員</option>
                                <option v-for="m in sortedLoginMembers" :key="m.id" :value="m.姓名">{{ m.姓名 }}</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-4 text-slate-300 pointer-events-none z-20"></i>
                        </div>

                        <div class="relative flex items-center mt-3">
                            <i class="fa-solid fa-shield-halved absolute left-4 text-slate-400 z-20"></i>
                            <input v-model="loginForm.pass" type="password" placeholder="安全密碼" class="med-input w-full p-4 font-bold bg-white relative z-10" style="padding-left: 3.5rem !important;">
                        </div>

                        <div v-if="errMsg" class="text-rose-500 text-xs font-bold text-center mt-2">{{ errMsg }}</div>

                        <button @click="bindAndLogin" class="med-btn w-full py-4 mt-4 transition-all uppercase tracking-widest text-[15px] font-black shadow-lg shadow-blue-200">
                            驗證並綁定
                        </button>
                    </template>

                    <!-- 所有人皆已綁定時顯示 -->
                    <template v-else>
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center mt-2">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
                                <i class="fa-solid fa-check-double text-xl"></i>
                            </div>
                            <p class="text-sm font-black text-slate-700 mb-1">所有人員皆已完成綁定</p>
                            <p class="text-[11px] font-bold text-slate-400 leading-relaxed mt-2">若您的帳號尚未開通或需更換綁定，<br>請聯繫管理員協助處理。</p>
                        </div>
                    </template>

                    <!-- 切換帳號按鈕 (保留在底部) -->
                    <button @click="logout" class="w-full py-3 mt-2 text-[11px] font-bold text-slate-400 hover:text-slate-600 transition-colors">
                        切換其他 Google 帳號
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 登入後 -->
    <template v-else>
       <!-- 加入 v-show 判斷 -->
<header v-show="currPage !== 'assessment' && currPage !== 'regular'" :style="{ paddingTop:'calc(1rem + var(--safe-top))' }" class="pb-4 px-6 flex justify-between items-center bg-[#f1f5f9] shrink-0 z-50">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-blue-600 text-lg font-black shadow-sm border border-slate-200">{{ userData.姓名?.charAt(0) }}</div>
        <div><p class="text-[10px] text-slate-400 font-bold tracking-wider uppercase mb-0.5">Welcome Back</p><h2 class="text-lg font-black text-slate-800">{{ userData.姓名 }} <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full ml-1 align-middle font-bold">{{ userData['duty_title'] || '隊員' }}</span></h2></div>
    </div>

    <!-- 右側按鈕群組 -->
    <div class="flex items-center gap-3">
      <!-- 🔔 最新消息小鈴鐺 -->
        <button @click="openNewsModal" class="relative w-9 h-9 rounded-full bg-white flex items-center justify-center text-slate-600 shadow-sm border border-slate-200 active:scale-95 transition-transform">
            <i class="fa-solid fa-bell text-sm"></i>
            <!-- 數字紅點提示 -->
            <span v-if="unreadCount > 0" class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 bg-rose-500 text-white text-[10px] font-black rounded-full shadow-sm flex items-center justify-center border-2 border-white">
                {{ unreadCount > 9 ? '9+' : unreadCount }}
            </span>
        </button>
        <!-- 登出按鈕 -->
        <button @click="logout" class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-slate-400 shadow-sm border border-slate-200 active:scale-95 transition-transform"><i class="fa-solid fa-power-off text-sm"></i></button>
    </div>
</header>

        <!-- 首頁 -->
        <div v-if="currPage === 'dashboard'" class="dashboard-wrapper fade-in">
            <div class="cards-section" :class="cardsExpanded ? 'expanded' : 'collapsed'">
                <div class="horizontal-scroll px-6 mb-2">
